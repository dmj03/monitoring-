# UC3 investigation playbooks — one per individual alert category.
#
# A playbook is the procedure layer. It says what to check and where to get it.
# It never contains customer facts.
#
# required_evidence is an ordered list. Each entry names:
#   key               - the evidence item as it appears in the evidence pack
#   tool              - which registered tool supplies it
#   field             - which field of that tool's return carries it
#   args              - how the tool's arguments resolve (alert.<field>, or a literal)
#   required          - true for investigation evidence, false for drill-down payload
#   missing_behaviour - what an absent value means for this item
#
# Entries resolving to the same (tool, args) are deduplicated by the executor
# into a single call.
#
# On missing_behaviour: the engine records every absent value identically, as
# MISSING with no value attached, and an absent value never fails or halts an
# investigation. The distinction below is interpretive — it tells the analyst and
# the model whether the gap bears on the outcome. It does not change execution.
#
#   record_missing_may_support_insufficient_evidence
#       required investigation evidence; its absence is a finding and may
#       support an insufficient-evidence recommendation
#   record_missing_no_outcome_impact
#       drill-down payload; its absence limits the UI view only
#
# Nothing here marks evidence as blocking. Insufficient evidence is a
# recommended outcome the analyst confirms, not an automatic gate.
#
# allowed_outcomes is a subset of investigation_outcomes in config.yaml. The
# model may recommend only from its playbook's subset.
#
# investigation_checklist IS the investigation guidance for a playbook. There is
# deliberately no second field restating it.

version: kb-playbooks-1.0.1-phase1
global_ai_boundaries:
  applies_to: every playbook in this KB
  note: These boundaries are global. Each playbook's own ai_boundaries field adds domain-specific restrictions
    on top of them and never relaxes them.
  model_may:
  - interpret evidence that was actually fetched
  - summarise the evidence pack
  - explain the pattern the evidence shows
  - produce an internal analyst rationale
  - recommend one outcome from the playbook's allowed_outcomes
  - recommend insufficient evidence where required evidence is MISSING
  model_must_not:
  - invent evidence
  - fabricate values
  - fill a MISSING field with an assumption
  - state or imply that evidence exists when it is MISSING
  - select the playbook
  - select tools
  - decide which evidence to retrieve
  - change the alert category
  - create a cluster
  - decide or modify cluster membership
  - invent customer, programme, transaction or screening information
  - override a deterministic tool result
  - bypass required evidence
  - make the final human decision
  - recommend an outcome outside the playbook's allowed_outcomes
  - change detection or clustering thresholds
  - change, override or modify approved policy or configuration
  - take prohibited external actions or act outside the approved workflow
  screening_specific:
  - must not confirm a possible match as a confirmed match
  - must not dismiss a possible match as cleared
  - must not make a final sanctions or PEP decision
  - must not infer anything from the confidence band beyond reporting its value
  outcome_contract: The model recommends. The analyst confirms. A recommended outcome is never a decision
    and is never final.
playbooks:
  unusual_transaction_velocity:
    playbook_id: unusual_transaction_velocity
    version: 1.0.0
    category: unusual_transaction_velocity
    rule_ids:
    - TM-VEL-014
    description: Transaction activity has risen sharply against the customer's own recent norm.
    purpose: Give the analyst both baselines, the verification position and prior alert history, so the
      rise can be judged as explained or unexplained. The playbook does not assess whether the upstream
      rule should have fired.
    investigation_focus: 'Establish whether the observed activity is explainable against the customer''s
      own baseline and the programme baseline, and whether verification evidence supports activity at
      this level.

      '
    required_evidence:
    - key: transaction_activity
      tool: get_transaction_summary
      field: transaction_count
      args:
        customer_ref: alert.customer_ref
        window_hours: 48
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: customer_transaction_baseline
      tool: get_transaction_summary
      field: customer_transaction_baseline
      args:
        customer_ref: alert.customer_ref
        window_hours: 48
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: programme_transaction_baseline
      tool: get_programme
      field: programme_transaction_baseline
      args:
        programme_ref: alert.programme_ref
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: onboarding_date
      tool: get_customer
      field: onboarding_date
      args:
        customer_ref: alert.customer_ref
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: kyb_status
      tool: get_customer
      field: kyb_status
      args:
        customer_ref: alert.customer_ref
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: beneficial_owner_status
      tool: get_customer
      field: beneficial_owner_status
      args:
        customer_ref: alert.customer_ref
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: source_of_funds
      tool: get_customer
      field: source_of_funds
      args:
        customer_ref: alert.customer_ref
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: prior_alerts
      tool: get_prior_alerts
      field: prior_alert_count
      args:
        customer_ref: alert.customer_ref
        lookback_days: 90
      required: true
      missing_behaviour: record_missing_may_support_insufficient_evidence
    - key: transaction_records
      tool: get_transactions
      field: transaction_id
      args:
        customer_ref: alert.customer_ref
        window_hours: 48
        limit: 25
      required: false
      missing_behaviour: record_missing_no_outcome_impact
    investigation_checklist:
    - Compare observed activity against the customer baseline and the programme baseline separately.
    - Confirm whether KYB and beneficial-owner verification are complete.
    - Review source-of-funds evidence for activity at this level.
    - Check whether prior alerts show a developing pattern.
    allowed_outcomes:
    - no_action_required
    - information_requested
    - escalate_to_mlro
    - insufficient_evidence_manual_investigation_required
    escalation_guidance: 'Suggest escalation for analyst decision where verification evidence is incomplete
      or the activity is unexplained against both baselines.

      '
    ai_boundaries: 'Do not state that the activity is suspicious or that the rule fired correctly. Recommend
      investigation focus only.

      '
