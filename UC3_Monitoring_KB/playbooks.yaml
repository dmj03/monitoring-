    - Assemble identifying context available for analyst comparison.
    - Note whether this customer has been through screening review before.
    - Route to the sanctions analyst under the approved escalation process.
    allowed_outcomes:
    - escalate_to_sanctions_analyst
    - insufficient_evidence_manual_investigation_required
